# whoami — Servicio de prueba (validación del patrón label + red externa)
#
# Stack SEPARADO de Traefik. La red `edge` es externa (la posee el stack de
# traefik). `docker compose down` aquí NO afecta al proxy ni a otros servicios.

services:
  whoami:
    image: traefik/whoami
    container_name: whoami
    restart: unless-stopped
    networks:
      - edge
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.whoami.rule=PathPrefix(`/whoami`)"
      - "traefik.http.routers.whoami.entrypoints=web"
      - "traefik.http.routers.whoami.middlewares=security-headers@file"
      - "traefik.http.services.whoami.loadbalancer.server.port=80"

networks:
  edge:
    external: true
